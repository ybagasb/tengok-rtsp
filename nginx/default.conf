server {
    listen 80;
    server_name _;

    # Batas ukuran upload. Default nginx hanya 1MB — terlalu kecil untuk
    # unggah dokumen/galeri (app membatasi 25MB/file). Beri sedikit kelonggaran.
    client_max_body_size 30M;

    # Maintenance page fallback — served when upstream (Next.js) is down
    error_page 502 503 504 /maintenance.html;

    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Serve logo for maintenance page
    location = /abipraya_original.svg {
        root /usr/share/nginx/html;
        try_files $uri @upstream;
    }

    location = /favicon.ico {
        root /usr/share/nginx/html;
        try_files $uri @upstream;
    }

    # Proxy all requests to Next.js app
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout settings
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Named location for upstream fallback
    location @upstream {
        proxy_pass http://app:3000;
    }
}
