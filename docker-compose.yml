version: '3.9'

services:
# ── Next.js App ──────────────────────────────────────────────────────────────
  app:
    image: ybagasbdd/dchcs:tengok.3   # ganti tag sesuai yang di-push ke Docker Hub
    container_name: tengok-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      # ── MongoDB AWS ──────────────────────────────────────────────────────────
      # Ganti dengan connection string MongoDB AWS Anda:
      # Atlas  : mongodb+srv://user:pass@cluster.mongodb.net/tengok?retryWrites=true&w=majority
      # EC2    : mongodb://user:pass@54.169.114.45:27017/tengok?authSource=admin
      - MONGODB_URI=mongodb://admin:Qwerty123.@54.169.114.45:27017/rtsp_tengok?authSource=admin

      # ── App ──────────────────────────────────────────────────────────────────
      - APP_PIN=123456

      # ── AWS Cognito SSO ──────────────────────────────────────────────────────
      - COGNITO_CLIENT_ID=5kdev0ace....                          # Client ID dari Cognito
      - COGNITO_CLIENT_SECRET=ssf1bl2abqismacofunmon6...         # Client Secret dari Cognito
      - COGNITO_ISSUER=https://cognito-idp.ap-south....          # Cognito Issuer URL
      - COGNITO_DOMAIN=https://auth.brantas-abipraya.co.id       # Cognito Custom Domain

      # ── NextAuth ─────────────────────────────────────────────────────────────
      # PENTING: NEXTAUTH_URL harus match dengan Allowed sign-out URLs di Cognito
      # Untuk production: https://tengok.brantas-abipraya.co.id
      - NEXTAUTH_URL=https://tengok.brantas-abipraya.co.id
      - NEXTAUTH_SECRET=..     # openssl rand -base64 32

      # ── Cognito Callback ─────────────────────────────────────────────────────
      - COGNITO_REDIRECT_URI=https://tengok.brantas-abipraya.co.id/api/auth/callback/cognito
    dns:
      - 8.8.8.8
      - 8.8.4.4