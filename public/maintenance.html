<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance — Tengok Monitoring</title>
    <link rel="icon" href="/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #020617;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ── Animated Background ── */
        .bg-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            animation: float 8s ease-in-out infinite;
        }
        .bg-glow-1 {
            width: 500px; height: 500px;
            background: rgba(234, 179, 8, 0.06);
            top: -10%; left: -10%;
            animation-delay: 0s;
        }
        .bg-glow-2 {
            width: 400px; height: 400px;
            background: rgba(249, 115, 22, 0.05);
            bottom: -15%; right: -10%;
            animation-delay: -4s;
        }
        .bg-glow-3 {
            width: 300px; height: 300px;
            background: rgba(234, 179, 8, 0.04);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -2s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -20px) scale(1.05); }
            66% { transform: translate(-20px, 15px) scale(0.95); }
        }

        /* ── Grid Pattern ── */
        .grid-pattern {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        /* ── Content ── */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 520px;
            padding: 2rem;
        }

        /* ── Animated Icon ── */
        .icon-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 3rem;
            border-radius: 2.5rem;
            background: rgba(234, 179, 8, 0.08);
            border: 1px solid rgba(234, 179, 8, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: breathe 3s ease-in-out infinite;
        }

        .icon-wrapper::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 2.8rem;
            border: 1px solid rgba(234, 179, 8, 0.08);
            animation: breathe 3s ease-in-out infinite reverse;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.85; }
        }

        .icon-wrapper svg {
            width: 48px;
            height: 48px;
            color: #eab308;
            animation: wrench 4s ease-in-out infinite;
        }

        @keyframes wrench {
            0%, 100% { transform: rotate(0deg); }
            10% { transform: rotate(-12deg); }
            20% { transform: rotate(8deg); }
            30% { transform: rotate(-5deg); }
            40%, 100% { transform: rotate(0deg); }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fbbf24, #f59e0b, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.1rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 0.75rem;
        }

        .description {
            font-size: 0.875rem;
            color: #64748b;
            line-height: 1.7;
            margin-bottom: 2.5rem;
        }

        /* ── Status Indicator ── */
        .status-card {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 24px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 1rem;
            backdrop-filter: blur(20px);
            margin-bottom: 3rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #eab308;
            box-shadow: 0 0 12px rgba(234, 179, 8, 0.6);
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; box-shadow: 0 0 12px rgba(234, 179, 8, 0.6); }
            50% { opacity: 0.5; box-shadow: 0 0 20px rgba(234, 179, 8, 0.3); }
        }

        .status-text {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #eab308;
        }

        /* ── Progress Bar ── */
        .progress-bar {
            width: 200px;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin: 0 auto 3rem;
            overflow: hidden;
        }

        .progress-bar-inner {
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, #eab308, #f59e0b);
            border-radius: 10px;
            animation: progress 2s ease-in-out infinite;
        }

        @keyframes progress {
            0% { transform: translateX(-100%); width: 40%; }
            50% { width: 60%; }
            100% { transform: translateX(350%); width: 40%; }
        }

        /* ── Footer ── */
        .footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            opacity: 0.3;
        }

        .footer img {
            height: 20px;
        }

        .footer-divider {
            width: 1px;
            height: 16px;
            background: rgba(255, 255, 255, 0.2);
        }

        .footer-text {
            font-size: 0.625rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #64748b;
        }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            h1 { font-size: 1.75rem; }
            .icon-wrapper { width: 96px; height: 96px; border-radius: 2rem; margin-bottom: 2rem; }
            .icon-wrapper svg { width: 36px; height: 36px; }
            .subtitle { font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <!-- Background Effects -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>
    <div class="grid-pattern"></div>

    <div class="container">
        <!-- Animated Wrench Icon -->
        <div class="icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
            </svg>
        </div>

        <h1>Sedang Dalam Perbaikan</h1>
        <p class="subtitle">Sistem monitoring sedang dalam pemeliharaan terjadwal.</p>
        <p class="description">
            Tim kami sedang melakukan peningkatan sistem untuk memberikan pengalaman monitoring yang lebih baik.
            Layanan akan segera kembali normal.
        </p>

        <!-- Status -->
        <div class="status-card">
            <div class="status-dot"></div>
            <span class="status-text">Maintenance in Progress</span>
        </div>

        <!-- Progress -->
        <div class="progress-bar">
            <div class="progress-bar-inner"></div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <img src="/abipraya_original.svg" alt="Logo" onerror="this.style.display='none'">
            <div class="footer-divider"></div>
            <span class="footer-text">Tengok Monitoring</span>
        </div>
    </div>
</body>
</html>
